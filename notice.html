<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>공지사항 | 애드윈법무사사무소</title>

  <link rel="icon" type="image/png" sizes="48x48" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/board.css">
</head>
<body data-page="notice">
<div id="awl-header"></div>
<section class="awl-sv">
  <div class="awl-sv-bg" style="background-image:url('assets/img/sub_bg_5.jpg')"></div>
  <div class="awl-sv-inner">
    <span class="awl-eyebrow">NOTICE</span>
    <h2>공지사항</h2>
    <p>사무소 소식과 등기 실무에 참고할 안내를 올립니다.</p>
    <nav class="awl-bread"><span>HOME</span><span>/</span><span>공지사항</span></nav>
  </div>
</section>

<section class="bd-sec">
  <div class="awl-wrap">
    <div class="bd-bar">
      <p class="bd-total">전체 <b id="ntTotal">0</b>건</p>
      <form class="bd-search" id="ntSearchForm" onsubmit="return false;">
        <input type="text" id="ntKeyword" placeholder="제목 또는 내용 검색" aria-label="공지사항 검색">
        <button type="submit">검색</button>
      </form>
    </div>

    <div class="nt-table">
      <div class="nt-thead">
        <span class="nt-c-no">번호</span>
        <span class="nt-c-tit">제목</span>
        <span class="nt-c-wr">작성자</span>
        <span class="nt-c-dt">작성일</span>
        <span class="nt-c-hit">조회</span>
      </div>
      <ul class="nt-tbody" id="ntList"></ul>
    </div>
    <p class="bd-empty" id="ntEmpty" hidden>검색 결과가 없습니다.</p>
    <div class="bd-pager" id="ntPager"></div>
  </div>
</section>

<div id="awl-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.config.js"></script>
<script src="assets/js/site.config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(function(){
  "use strict";
  var state = { page:1, size:10, keyword:"" };

  function render(){
    DATA_getNotices(state, function(res){
      var h = "", i, r;
      for(i=0;i<res.rows.length;i++){
        r = res.rows[i];
        h += "<li><a href=\"notice-view.html?id=" + r.id + "\">" +
             (r.is_top ? "<span class=\"nt-c-no\"><em class=\"nt-top\">공지</em></span>"
                       : "<span class=\"nt-c-no\">" + r._no + "</span>") +
             "<span class=\"nt-c-tit\">" + DATA_esc(r.title) + "</span>" +
             "<span class=\"nt-c-wr\">" + DATA_esc(r.writer) + "</span>" +
             "<span class=\"nt-c-dt\">" + AWL.date(r.created_at) + "</span>" +
             "<span class=\"nt-c-hit\">" + Number(r.views || 0) + "</span></a></li>";
      }
      document.getElementById("ntList").innerHTML = h;
      document.getElementById("ntTotal").textContent = res.total;
      document.getElementById("ntEmpty").hidden = res.total !== 0;
      document.getElementById("ntPager").innerHTML = DATA_pager(res.total, state.page, state.size, "bd-");
    });
  }

  document.getElementById("ntSearchForm").addEventListener("submit", function(){
    state.keyword = document.getElementById("ntKeyword").value; state.page = 1; render();
  });
  document.getElementById("ntPager").addEventListener("click", function(e){
    var go = e.target.getAttribute("data-go");
    if(go){ state.page = parseInt(go, 10); render(); window.scrollTo({ top:0, behavior:"smooth" }); }
  });

  render();
})();
</script>
</body>
</html>
