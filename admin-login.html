<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>관리자 로그인 | 애드윈법무사사무소</title>

  <link rel="icon" type="image/png" sizes="48x48" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="ad-body">

<div class="ad-login">
  <form class="ad-login-box" id="adForm" novalidate>
    <div class="ad-login-logo"><img id="adLogo" src="assets/img/logo.png" alt=""></div>
    <h1>관리자 로그인</h1>
    <p>공지사항 · 갤러리 관리</p>

    <div class="ad-row">
      <label class="ad-label" for="adId">이메일</label>
      <input type="email" id="adId" class="ad-input" autocomplete="username"
        autocapitalize="off" spellcheck="false" placeholder="admin@example.com">
    </div>
    <div class="ad-row">
      <label class="ad-label" for="adPw">비밀번호</label>
      <input type="password" id="adPw" class="ad-input" autocomplete="current-password">
    </div>

    <p class="ad-msg" id="adMsg" hidden></p>
    <button type="submit" class="ad-btn ad-btn--seal" id="adBtn">로그인</button>
    <a class="ad-login-back" href="index.html">← 홈페이지로 돌아가기</a>

    <div class="ad-login-tip">
      Supabase Auth 로 인증합니다. 계정 추가·비밀번호 변경은
      Supabase 대시보드의 <b>Authentication &gt; Users</b> 에서 하세요.
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.config.js"></script>
<script src="assets/js/site.config.js"></script>
<script src="assets/js/data.js"></script>
<script>
(function(){
  "use strict";

  /* 로고 경로는 site.config.js 를 따릅니다 */
  var logo = document.getElementById("adLogo");
  if(SITE && SITE.logo){ logo.src = SITE.logo; logo.alt = SITE.name; }

  var form = document.getElementById("adForm");
  var msg  = document.getElementById("adMsg");
  var btn  = document.getElementById("adBtn");
  var busy = false;

  /* 이미 로그인한 상태면 바로 관리 화면으로 보냅니다 */
  DATA_isAdmin(function(ok){ if(ok){ window.location.replace("admin.html"); } });

  function fail(text, el){
    msg.textContent = text;
    msg.className = "ad-msg";
    msg.hidden = false;
    if(el && el.focus){ el.focus(); }
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(busy){ return; }
    msg.hidden = true;

    var id = document.getElementById("adId");
    var pw = document.getElementById("adPw");
    if(!id.value.trim()){ return fail("이메일을 입력해 주세요.", id); }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id.value.trim())){
      return fail("이메일 형식을 확인해 주세요.", id);
    }
    if(!pw.value){ return fail("비밀번호를 입력해 주세요.", pw); }

    busy = true;
    btn.disabled = true;
    btn.textContent = "확인 중";

    DATA_login(id.value.trim(), pw.value, function(res){
      if(res.ok){
        window.location.replace("admin.html");
        return;
      }
      busy = false;
      btn.disabled = false;
      btn.textContent = "로그인";
      pw.value = "";
      fail(res.message, pw);
    });
  });
})();
</script>
</body>
</html>
