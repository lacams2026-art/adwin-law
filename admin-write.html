<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>글쓰기 | 애드윈법무사사무소</title>

  <link rel="icon" type="image/png" sizes="48x48" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="ad-body">

<header class="ad-top">
  <div class="ad-top-inner">
    <a class="ad-brand" href="admin.html">애드윈법무사사무소 <span>ADMIN</span></a>
    <div class="ad-top-util">
      <a href="index.html">사이트 보기</a>
      <button type="button" id="adLogout">로그아웃</button>
    </div>
  </div>
</header>

<div class="ad-wrap">
  <div class="ad-head">
    <div>
      <h2 id="adTitle">새 글 쓰기</h2>
      <p id="adSubtitle">공지사항</p>
    </div>
    <a class="ad-btn ad-btn--line" href="admin.html">← 목록으로</a>
  </div>

  <form class="ad-card ad-card-pad" id="adForm" novalidate>

    <div class="ad-row">
      <label class="ad-label" for="adT">제목 <i>*</i></label>
      <input type="text" id="adT" class="ad-input" maxlength="120" placeholder="제목을 입력하세요">
    </div>

    <!-- ---------- 공지사항 전용 ---------- -->
    <div id="adNoticeFields">
      <div class="ad-row">
        <label class="ad-label" for="adW">작성자</label>
        <input type="text" id="adW" class="ad-input" maxlength="30" value="관리자">
      </div>
      <div class="ad-row">
        <label class="ad-check">
          <input type="checkbox" id="adTop">
          <span>목록 맨 위에 고정 (공지)</span>
        </label>
        <span class="ad-check-note">고정한 글은 번호 대신 ‘공지’ 표시가 붙고 항상 위쪽에 노출됩니다.</span>
      </div>
      <div class="ad-row">
        <label class="ad-label" for="adC">내용 <i>*</i></label>
        <textarea id="adC" class="ad-textarea" rows="14" placeholder="내용을 입력하세요. 줄바꿈은 그대로 반영됩니다."></textarea>
      </div>
    </div>

    <!-- ---------- 갤러리 전용 ---------- -->
    <div id="adGalleryFields" hidden>
      <div class="ad-row">
        <label class="ad-label" for="adD">설명</label>
        <textarea id="adD" class="ad-textarea" rows="5" placeholder="사진에 대한 설명을 입력하세요."></textarea>
      </div>
      <div class="ad-row">
        <label class="ad-label" for="adFile">
          사진 <i>*</i>
          <span class="ad-hint">(여러 장 선택 가능 · 최대 12장 · 첫 번째 사진이 목록 대표 이미지가 됩니다)</span>
        </label>
        <input type="file" id="adFile" class="ad-file" multiple accept="image/jpeg,image/png,image/webp,image/gif">
        <label class="ad-drop" id="adDrop" for="adFile">
          <span class="ad-drop-txt">사진을 끌어다 놓거나 <span>여기를 클릭</span>해 선택하세요</span>
          <span class="ad-drop-sub">JPG · PNG · WEBP · GIF</span>
        </label>
        <div class="ad-imgs" id="adImgs"></div>
        <p class="ad-img-note" id="adImgNote"></p>
      </div>
    </div>

    <p class="ad-msg" id="adMsg" hidden></p>

    <div class="ad-foot">
      <span class="ad-del-wrap" id="adDelWrap" hidden>
        <button type="button" class="ad-btn ad-btn--danger" id="adDel">삭제</button>
      </span>
      <a class="ad-btn ad-btn--line" href="admin.html">취소</a>
      <button type="submit" class="ad-btn ad-btn--seal" id="adSave">저장</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.config.js"></script>
<script src="assets/js/site.config.js"></script>
<script src="assets/js/data.js"></script>
<script>
(function(){
  "use strict";
  /* 로그인 확인이 끝난 뒤에 화면을 구성합니다 (Supabase 세션 조회는 비동기) */
  DATA_requireAdmin(start);
  function start(){

  /* ======================================================================
     이미지 설정
     원본을 그대로 올리면 방문자 쪽 로딩이 느려지므로, 업로드 전에
     브라우저에서 크기를 줄입니다. 큰 사진(원본)과 목록용 썸네일 2장이
     Supabase Storage 에 저장됩니다.
     ====================================================================== */
  var IMG_MAX_COUNT = 12;
  var IMG_FULL_PX   = 1600;   /* 상세 화면용 긴 변 최대 픽셀 */
  var IMG_FULL_Q    = 0.82;
  var IMG_THUMB_PX  = 600;    /* 목록 썸네일용 */
  var IMG_THUMB_Q   = 0.75;

  /* 주소창의 ?type=... &id=... 값을 읽습니다
     (관리자 화면은 layout.js 를 쓰지 않으므로 여기서 직접 처리합니다) */
  function q(key){
    var s = window.location.search.substring(1).split("&"), i, kv;
    for(i=0;i<s.length;i++){
      kv = s[i].split("=");
      if(decodeURIComponent(kv[0]) === key){ return decodeURIComponent(kv[1] || ""); }
    }
    return "";
  }

  var type = q("type") === "gallery" ? "gallery" : "notice";
  var id   = q("id");
  var isEdit = !!id;

  var form   = document.getElementById("adForm");
  var msg    = document.getElementById("adMsg");
  var saveBt = document.getElementById("adSave");
  var imgsEl = document.getElementById("adImgs");
  var noteEl = document.getElementById("adImgNote");
  var images = [];          /* [{ full, thumb }] */
  var busy   = false;

  /* ---------------- 화면 전환 ---------------- */
  document.getElementById("adNoticeFields").hidden  = (type !== "notice");
  document.getElementById("adGalleryFields").hidden = (type !== "gallery");
  document.getElementById("adSubtitle").textContent = (type === "notice" ? "공지사항" : "갤러리");
  document.getElementById("adTitle").textContent    = isEdit ? "글 수정" : "새 글 쓰기";
  document.title = (isEdit ? "글 수정" : "글쓰기") + " | 애드윈법무사사무소";

  function say(text, ok){
    msg.textContent = text;
    msg.className = "ad-msg" + (ok ? " ad-msg--ok" : "");
    msg.hidden = false;
    msg.scrollIntoView({ block:"center", behavior:"smooth" });
  }
  function fail(text, el){
    say(text, false);
    if(el && el.focus){ el.focus(); }
    return false;
  }

  /* ---------------- 기존 글 불러오기 ---------------- */
  if(isEdit){
    document.getElementById("adDelWrap").hidden = false;
    if(type === "notice"){
      DATA_getNotice(id, function(res){
        if(!res.row){ return say("해당 글을 찾을 수 없습니다.", false); }
        document.getElementById("adT").value   = res.row.title || "";
        document.getElementById("adW").value   = res.row.writer || "관리자";
        document.getElementById("adC").value   = res.row.content || "";
        document.getElementById("adTop").checked = !!res.row.is_top;
      });
    }else{
      DATA_getGalleryItem(id, function(res){
        if(!res.row){ return say("해당 글을 찾을 수 없습니다.", false); }
        document.getElementById("adT").value = res.row.title || "";
        document.getElementById("adD").value = res.row.description || "";
        images = (res.row.images || []).slice(0);
        renderImgs();
      });
    }
  }

  /* ======================================================================
     이미지 처리
     ====================================================================== */
  function loadImage(file, cb){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload  = function(){ cb(null, im); };
      im.onerror = function(){ cb(new Error("이미지를 읽을 수 없습니다.")); };
      im.src = fr.result;
    };
    fr.onerror = function(){ cb(new Error("파일을 읽을 수 없습니다.")); };
    fr.readAsDataURL(file);
  }

  /* 캔버스로 크기를 줄여 용량을 낮춥니다 */
  function shrink(im, maxPx, quality){
    var w = im.width, h = im.height;
    var s = Math.min(1, maxPx / Math.max(w, h));
    var c = document.createElement("canvas");
    c.width  = Math.max(1, Math.round(w * s));
    c.height = Math.max(1, Math.round(h * s));
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#fff";                 /* 투명 PNG 대비 흰 배경 */
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(im, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", quality);
  }

  function addFiles(fileList){
    var queue = [], i;
    for(i=0;i<fileList.length;i++){
      if(String(fileList[i].type).indexOf("image/") !== 0){ continue; }
      queue.push(fileList[i]);
    }
    if(!queue.length){ return say("이미지 파일만 첨부할 수 있습니다.", false); }

    if(images.length + queue.length > IMG_MAX_COUNT){
      queue = queue.slice(0, Math.max(0, IMG_MAX_COUNT - images.length));
      say("사진은 최대 " + IMG_MAX_COUNT + "장까지 넣을 수 있습니다.", false);
    }
    if(!queue.length){ return; }

    noteEl.textContent = "사진을 처리하는 중입니다…";
    var left = queue.length;

    queue.forEach(function(f){
      loadImage(f, function(err, im){
        if(!err){
          try{
            images.push({
              full:  shrink(im, IMG_FULL_PX,  IMG_FULL_Q),
              thumb: shrink(im, IMG_THUMB_PX, IMG_THUMB_Q)
            });
          }catch(e){ /* 손상된 이미지는 건너뜁니다 */ }
        }
        left--;
        if(left === 0){ renderImgs(); }
      });
    });

    try{ document.getElementById("adFile").value = ""; }catch(e){}
  }

  function renderImgs(){
    var h = "", i;
    for(i=0;i<images.length;i++){
      h += "<div class=\"ad-img\">" +
             (i === 0 ? "<span class=\"ad-img-main\">대표</span>" : "") +
             "<div class=\"ad-img-box\"><img src=\"" + images[i].thumb + "\" alt=\"\"></div>" +
             "<div class=\"ad-img-bar\">" +
               "<button type=\"button\" data-mv=\"up\"   data-i=\"" + i + "\" " +
                 (i === 0 ? "disabled" : "") + " aria-label=\"앞으로\">←</button>" +
               "<button type=\"button\" data-mv=\"down\" data-i=\"" + i + "\" " +
                 (i === images.length-1 ? "disabled" : "") + " aria-label=\"뒤로\">→</button>" +
               "<button type=\"button\" class=\"ad-img-del\" data-rm=\"" + i + "\" aria-label=\"삭제\">×</button>" +
             "</div>" +
           "</div>";
    }
    imgsEl.innerHTML = h;

    var bytes = 0;
    for(i=0;i<images.length;i++){ bytes += images[i].full.length + images[i].thumb.length; }
    noteEl.textContent = images.length
      ? images.length + "장 · 약 " + Math.round(bytes/1024) + " KB (업로드 전에 자동으로 크기를 줄입니다)"
      : "";
  }

  imgsEl.addEventListener("click", function(e){
    var rm = e.target.getAttribute && e.target.getAttribute("data-rm");
    var mv = e.target.getAttribute && e.target.getAttribute("data-mv");
    var i  = e.target.getAttribute && e.target.getAttribute("data-i");

    if(rm !== null && rm !== undefined){
      images.splice(parseInt(rm, 10), 1);
      renderImgs();
      return;
    }
    if(mv){
      i = parseInt(i, 10);
      var j = (mv === "up") ? i-1 : i+1;
      if(j < 0 || j >= images.length){ return; }
      var tmp = images[i]; images[i] = images[j]; images[j] = tmp;
      renderImgs();
    }
  });

  document.getElementById("adFile").addEventListener("change", function(){
    if(this.files && this.files.length){ addFiles(this.files); }
  });

  /* 드래그 앤 드롭 */
  var drop = document.getElementById("adDrop");
  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){
      e.preventDefault(); e.stopPropagation(); drop.classList.add("is-over");
    });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){
      e.preventDefault(); e.stopPropagation(); drop.classList.remove("is-over");
    });
  });
  drop.addEventListener("drop", function(e){
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      addFiles(e.dataTransfer.files);
    }
  });
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("drop",     function(e){ e.preventDefault(); });

  /* ======================================================================
     저장
     ====================================================================== */
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(busy){ return; }
    msg.hidden = true;

    var t = document.getElementById("adT");
    if(!t.value.trim()){ return fail("제목을 입력해 주세요.", t); }

    var row = { title: t.value.trim() };
    if(isEdit){ row.id = id; }

    if(type === "notice"){
      var c = document.getElementById("adC");
      if(!c.value.trim()){ return fail("내용을 입력해 주세요.", c); }
      row.content = c.value.trim();
      row.writer  = document.getElementById("adW").value.trim() || "관리자";
      row.is_top  = document.getElementById("adTop").checked;
    }else{
      if(!images.length){ return fail("사진을 한 장 이상 넣어 주세요."); }
      row.description = document.getElementById("adD").value.trim();
      row.images      = images;
    }

    busy = true;
    saveBt.disabled = true;
    saveBt.textContent = "저장 중";

    var done = function(res){
      busy = false;
      saveBt.disabled = false;
      saveBt.textContent = "저장";
      if(res.ok){
        window.location.href = "admin.html";
        return;
      }
      say("저장에 실패했습니다. " + (res.message || "다시 시도해 주세요."), false);
    };

    if(type === "notice"){
      DATA_saveNotice(row, done);
    }else{
      DATA_saveGallery(row, done, function(cur, all){
        saveBt.textContent = "사진 올리는 중 " + cur + "/" + all;
      });
    }
  });

  /* ---------------- 삭제 ---------------- */
  var delBt = document.getElementById("adDel");
  if(delBt){
    delBt.addEventListener("click", function(){
      if(!window.confirm("이 글을 삭제할까요?\n삭제한 글은 되돌릴 수 없습니다.")){ return; }
      var done = function(res){
        if(res.ok){ window.location.href = "admin.html"; }
        else{ say("삭제에 실패했습니다.", false); }
      };
      if(type === "notice"){ DATA_deleteNotice(id, done); }
      else{ DATA_deleteGallery(id, done); }
    });
  }

  /* ---------------- 로그아웃 ---------------- */
  document.getElementById("adLogout").addEventListener("click", function(){
    DATA_logout(function(){ window.location.replace("admin-login.html"); });
  });
  }
})();
</script>
</body>
</html>
