<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>페이지를 찾을 수 없습니다 | 애드윈법무사사무소</title>

  <link rel="icon" type="image/png" sizes="48x48" href="/adwin-law/assets/img/favicon.png">
  <link rel="apple-touch-icon" href="/adwin-law/assets/img/favicon-180.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <!-- ※ 404 는 어떤 깊이의 주소에서도 뜨므로 반드시 절대경로를 씁니다 -->
  <link rel="stylesheet" href="/adwin-law/assets/css/base.css">

  <style>
    .e4-wrap{min-height:100vh;display:flex;flex-direction:column;
      background:var(--awl-navy);color:#fff;position:relative;overflow:hidden}
    .e4-bg{position:absolute;inset:0;background:#16324B center/cover no-repeat;opacity:.16}
    .e4-veil{position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(13,27,42,.35) 0%,rgba(13,27,42,.75) 100%)}
    .e4-top{position:relative;z-index:1;padding:26px 24px;
      border-bottom:1px solid rgba(255,255,255,.12)}
    .e4-top img{height:34px;width:auto}
    .e4-body{position:relative;z-index:1;flex:1;display:flex;align-items:center;
      justify-content:center;padding:60px 24px 80px}
    .e4-inner{max-width:660px;width:100%;text-align:center}
    .e4-code{font-family:var(--awl-mono);font-size:15px;letter-spacing:.34em;
      color:var(--awl-rose);margin-bottom:26px}
    .e4-inner h1{font-family:var(--awl-serif);font-size:clamp(26px,4.6vw,40px);
      font-weight:700;letter-spacing:-.035em;line-height:1.4;margin-bottom:18px}
    .e4-inner p{color:rgba(255,255,255,.66);font-size:16.5px;line-height:1.85}
    .e4-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:38px}
    .e4-tel{margin-top:34px;padding-top:26px;border-top:1px solid rgba(255,255,255,.14);
      font-size:14.5px;color:rgba(255,255,255,.5)}
    .e4-tel a{font-family:var(--awl-mono);font-size:21px;color:#fff;
      display:inline-block;margin-top:8px;letter-spacing:.02em}
    .e4-tel a:hover{color:var(--awl-rose)}
    @media (max-width:600px){
      .e4-btns .awl-btn{width:100%}
      .e4-body{padding:44px 20px 60px}
    }
  </style>
</head>
<body>

<div class="e4-wrap">
  <div class="e4-bg" ></div>
  <div class="e4-veil"></div>

  <div class="e4-top">
    <a href="/adwin-law/"><img src="/adwin-law/assets/img/logo_white.png" alt="애드윈법무사사무소"></a>
  </div>

  <div class="e4-body">
    <div class="e4-inner">
      <p class="e4-code">404 NOT FOUND</p>
      <h1>요청하신 페이지를<br>찾을 수 없습니다.</h1>
      <p>
        주소가 변경되었거나 삭제된 페이지입니다.<br>
        아래에서 원하시는 곳으로 이동해 주세요.
      </p>

      <div class="e4-btns">
        <a class="awl-btn awl-btn--seal" href="/adwin-law/">홈으로 가기</a>
        <a class="awl-btn awl-btn--line" href="/adwin-law/apply.html">온라인 상담 신청</a>
        <a class="awl-btn awl-btn--line" href="/adwin-law/biz-realestate.html">업무분야 보기</a>
      </div>

      <p class="e4-tel">
        찾으시는 내용이 없다면 전화로 문의해 주세요.
        <a href="tel:0269255235">02-6925-5235</a>
      </p>
    </div>
  </div>
</div>

</body>
</html>
